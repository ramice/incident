<html lang="bs">

<meta property="og:title" content="Je li incident značajan za prijavu?">

<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0E13'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='%23FF3B5C'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0A0E13;--panel:#121922;--panel2:#17202B;--panel3:#1D2833;
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.17);
  --sf1:rgba(255,255,255,.03);--sf2:rgba(255,255,255,.04);--sf3:rgba(255,255,255,.05);
  --sf4:rgba(255,255,255,.08);--trak:rgba(255,255,255,.10);--sjena:0 24px 60px -30px #000;
  --tx:#ECF2F8;--tx2:#BAC7D4;--muted:#8496A6;--faint:#63768A;
  --acc:#FF3B5C;--acc-rgb:255,59,92;--acc-d:#D62348;--acc2:#FF7A4D;--acc-dim:rgba(var(--acc-rgb),.16);
  --hot:#FF3B5C;--hot-rgb:255,59,92;--nalaz-bg:linear-gradient(180deg,#1B1220,#141A22);
  --ok:#2FD8A8;--ok-dim:rgba(47,216,168,.14);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --t:180ms cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--tx);font-size:16px;line-height:1.5;padding-bottom:116px;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;background:
    radial-gradient(120% 70% at 50% -10%,rgba(var(--acc-rgb),.13),transparent 62%),
    radial-gradient(90% 60% at 90% 8%,rgba(47,216,168,.07),transparent 60%),
    linear-gradient(180deg,#0C1219 0%,var(--bg) 42%)}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wrap{max-width:660px;margin:0 auto;padding:26px 20px 0}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;text-align:center;border:1px solid var(--line2);border-radius:20px;
  padding:38px 26px 30px;background:
    radial-gradient(120% 120% at 50% -20%,rgba(var(--acc-rgb),.20),transparent 58%),
    linear-gradient(180deg,var(--sf3),rgba(255,255,255,.01));
  box-shadow:0 24px 60px -30px rgba(var(--acc-rgb),.55),inset 0 1px 0 var(--sf4)}
.hero.mini{padding:22px 20px 18px;border-radius:16px;
  box-shadow:0 16px 40px -32px rgba(var(--acc-rgb),.5),inset 0 1px 0 rgba(255,255,255,.06)}
.sjaj{position:absolute;left:50%;top:-70px;width:280px;height:180px;transform:translateX(-50%);
  background:radial-gradient(closest-side,rgba(var(--acc-rgb),.5),transparent 72%);filter:blur(26px);pointer-events:none}
.eyebrow{position:relative;margin:0 auto;font-size:17px;font-weight:500;color:var(--tx2);letter-spacing:.005em;
  line-height:1.4;max-width:32em}
.nas-post{position:relative;margin:0 auto;font-size:16px;font-weight:500;color:var(--tx2);letter-spacing:.005em;
  line-height:1.45;max-width:30em;text-wrap:balance}
.hero.mini .eyebrow{font-size:12.5px;color:var(--muted);font-weight:400}
.hero.mini .eyebrow:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--acc);margin-right:8px;vertical-align:.12em;box-shadow:0 0 9px 1px rgba(var(--acc-rgb),.75)}
h1{position:relative;font-family:var(--serif);font-size:64px;line-height:1;font-weight:400;
  margin:0 0 6px;padding-bottom:.1em;letter-spacing:.015em;text-wrap:balance;color:var(--tx);
  background:linear-gradient(180deg,#fff 26%,#B9C7D6 92%);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent}
h1.mali{font-size:27px;line-height:1.18;margin:8px 0 0;padding-bottom:.12em;letter-spacing:-.015em;text-transform:none}
.dek{position:relative;margin:20px auto 0;color:var(--muted);font-size:14.5px;line-height:1.6;max-width:31em}
.rez{position:relative;display:inline-flex;gap:5px;margin:22px 0 0;padding:5px;border-radius:999px;
  background:var(--sf3);border:1px solid var(--line)}
.rez button{font-size:13px;color:var(--muted);padding:9px 18px;border-radius:999px;transition:all var(--t)}
.rez button:hover{color:var(--tx)}
.rez button.on{color:#fff;background:linear-gradient(180deg,var(--acc),var(--acc-d));
  box-shadow:0 6px 18px -8px var(--acc),inset 0 1px 0 rgba(255,255,255,.25)}
.privatno{display:inline-flex;align-items:center;gap:9px;margin:18px auto 0;padding:9px 15px;border-radius:999px;
  border:1px solid var(--line);background:var(--sf1);font-size:12px;color:var(--muted);line-height:1.5;
  text-align:left;max-width:min(100%,34em)}
.privatno .ic{width:15px;height:15px;color:var(--ok);flex:none}
.privatno-red{display:flex;justify-content:center}

.nacini{position:relative;display:inline-flex;gap:4px;margin:20px 0 0;padding:4px;border-radius:999px;
  background:var(--sf2);border:1px solid var(--line)}
.nacini button{font-size:13px;color:var(--muted);padding:9px 18px;border-radius:999px;transition:all var(--t)}
.nacini button:hover{color:var(--tx)}
.nacini button.on{background:var(--panel3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}
.pit-p{margin:2px 0 14px;font-size:14.5px;color:var(--tx2);line-height:1.55}
.pit-p b{font-weight:640;color:var(--tx)}
.yn-svijetli button{border-color:var(--line2);color:var(--tx2);background:var(--sf2)}
.yn-svijetli button:hover{background:var(--sf4);color:var(--tx)}
.yn-svijetli button.da.on{background:linear-gradient(180deg,var(--acc),var(--acc-d));border-color:transparent;color:#fff}
.yn-svijetli button.ne.on{background:var(--panel3);border-color:var(--line2);color:var(--tx)}
.tipke{margin:18px 0 0;font-size:12px;color:var(--faint)}
.uBrowseru{display:flex;align-items:flex-start;gap:9px;margin:0 0 16px;padding:12px 15px;border-radius:12px;
  border:1px solid rgba(47,216,168,.28);background:var(--ok-dim);font-size:12.5px;color:var(--ok);line-height:1.55}
.uBrowseru .ic{width:16px;height:16px;flex:none;margin-top:1px}
.uporedi-b{display:flex;width:100%;align-items:center;justify-content:center;gap:10px;padding:13px;
  border:1px solid var(--line2);border-radius:13px;background:var(--sf2);color:var(--tx2);font-size:14px;
  margin-bottom:12px;transition:all var(--t)}
.uporedi-b:hover{border-color:var(--acc);color:#fff}
.uporedi-b .ic{width:17px;height:17px;color:var(--muted)}
.uporedba{border:1px solid var(--line);border-radius:16px;padding:6px 18px 14px;margin-bottom:14px;background:var(--sf1)}
.uporedba .tbl td b.da{color:var(--acc);font-weight:600}
.uporedba .tbl td b.ne{color:var(--ok);font-weight:600}
.uporedba-n{margin:8px 0 0;font-size:12.5px;color:var(--muted)}

/* ---------- lampice ---------- */
.staze{display:flex;gap:10px;margin:22px 0 0}
.staze div{flex:1;display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:11px;
  background:var(--sf1);border:1px solid var(--line);transition:all var(--t)}
.staze .lampa{width:9px;height:9px;border-radius:50%;background:#2B3947;flex:none;transition:all var(--t)}
.staze .st-n{font-family:var(--mono);font-size:11px;color:var(--faint)}
.staze .st-t{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.staze .gotov{border-color:var(--line2)}
.staze .gotov .lampa{background:#52708A}
.staze .gotov .st-n,.staze .gotov .st-t{color:var(--muted)}
.staze .sad{background:linear-gradient(180deg,rgba(var(--acc-rgb),.14),rgba(var(--acc-rgb),.05));border-color:rgba(var(--acc-rgb),.45)}
.staze .sad .lampa{background:var(--acc);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.18),0 0 14px 2px rgba(var(--acc-rgb),.8);
  animation:puls 2.4s ease-in-out infinite}
.staze .sad .st-n{color:var(--acc)}
.staze .sad .st-t{color:var(--tx)}
@keyframes ulaz{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes puls{0%,100%{box-shadow:0 0 0 3px rgba(var(--acc-rgb),.18),0 0 12px 1px rgba(var(--acc-rgb),.65)}
  50%{box-shadow:0 0 0 5px rgba(var(--acc-rgb),.10),0 0 20px 4px rgba(var(--acc-rgb),.95)}}

/* ---------- prvi uslov ---------- */
.uslov{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:18px;padding:26px 22px 22px;margin:24px 0 0;box-shadow:0 20px 50px -34px #000}
.uslov .oznaka{margin:0 0 7px;font-size:11.5px;color:var(--acc);letter-spacing:.16em;text-transform:uppercase}
.uslov h2{font-family:var(--serif);font-size:26px;font-weight:400;margin:0 0 9px;color:var(--tx);letter-spacing:-.02em}
.uslov .uvod{margin:0;font-size:14px;color:var(--muted);line-height:1.6;max-width:33em}
.pit{border-top:1px solid var(--line);padding:21px 0 18px;margin-top:20px}
.pit-h{display:flex;align-items:center;gap:10px;color:var(--faint)}
.pit-n{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.pit-t{display:block;font-size:16px;margin:10px 0 7px;color:var(--tx);line-height:1.45}
.pit-t b{font-weight:650;color:#fff}
.pit-o{display:block;font-size:13.5px;color:var(--faint);line-height:1.6;margin:0 0 15px;max-width:34em}
.yn{display:flex;gap:10px}
.yn button{flex:1;border:1px solid var(--line2);color:var(--tx2);border-radius:11px;padding:13px;font-size:15px;
  background:var(--sf1);transition:all var(--t)}
.yn button:hover{background:var(--sf4);color:#fff}
.yn button.da.on{background:linear-gradient(180deg,var(--acc),var(--acc-d));border-color:transparent;color:#fff;
  font-weight:650;box-shadow:0 10px 24px -12px var(--acc)}
.yn button.ne.on{background:linear-gradient(180deg,#41556B,#2A3949);border-color:#5A7089;color:#fff;font-weight:650;box-shadow:0 10px 24px -14px #000,inset 0 1px 0 rgba(255,255,255,.16),0 0 0 1px var(--trak)}
.ish{margin-top:20px;padding:14px 16px;border-radius:12px;font-size:14px;line-height:1.6}
.ish.pass{background:var(--ok-dim);color:var(--ok);border:1px solid rgba(47,216,168,.28)}
.ish.fail{background:var(--sf2);color:var(--muted);border:1px solid var(--line)}

/* ---------- sažetak, sekcije ---------- */
.sazet{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin:20px 0 24px;
  padding:15px 17px;border:1px solid var(--line);border-radius:14px;background:var(--sf1)}
.sazet .ozn{font-size:11px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase}
.cipovi{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.cip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:12.5px;
  color:var(--tx2);background:rgba(var(--acc-rgb),.10);border:1px solid rgba(var(--acc-rgb),.32)}
.cip:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--acc);flex:none;
  box-shadow:0 0 8px 1px rgba(var(--acc-rgb),.8)}
.cip.prazan{background:var(--sf2);border-color:var(--line);color:var(--muted)}
.cip.prazan:before{background:var(--faint);box-shadow:none}
.sazet button{color:var(--acc);font-size:13px;border-bottom:1px solid currentColor;flex:none}
.sekcija{margin:0 0 20px}
.sekcija .oznaka{margin:0 0 6px;font-size:11.5px;color:var(--acc);letter-spacing:.16em;text-transform:uppercase}
.sekcija p{margin:0;color:var(--tx2);font-size:14.5px;line-height:1.6;max-width:34em}
.kratko{border-radius:16px;padding:20px 22px;margin:0 0 22px;color:#fff;
  background:linear-gradient(135deg,rgba(var(--acc-rgb),.9),rgba(255,122,77,.75));
  box-shadow:0 20px 44px -24px var(--acc)}
.kratko b{display:block;font-family:var(--serif);font-size:21px;font-weight:400;margin-bottom:7px;letter-spacing:-.015em}
.kratko span{font-size:14px;color:rgba(255,255,255,.86);line-height:1.6}

/* ---------- kartice ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px 18px;margin-bottom:11px;
  transition:border-color var(--t),box-shadow var(--t),transform var(--t)}
.card:hover{border-color:var(--line2);transform:translateY(-1px)}
.card.met{border-color:rgba(var(--acc-rgb),.42);
  background:linear-gradient(180deg,rgba(var(--acc-rgb),.10),rgba(var(--acc-rgb),.02)),var(--panel);
  box-shadow:0 18px 40px -28px var(--acc)}
.card-h{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.plocica{position:relative;flex:none;width:38px;height:38px;border-radius:12px;background:var(--sf2);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;transition:all var(--t)}
.plocica .ic{width:19px;height:19px;color:var(--muted);transition:color var(--t)}
.plocica i{position:absolute;top:-6px;left:-6px;min-width:17px;height:17px;border-radius:9px;background:var(--panel3);
  border:1px solid var(--line);color:var(--faint);font-style:normal;font-family:var(--mono);font-size:10px;
  display:flex;align-items:center;justify-content:center;transition:all var(--t)}
.card.met .plocica{background:rgba(var(--acc-rgb),.14);border-color:rgba(var(--acc-rgb),.42);
  box-shadow:0 0 22px -8px rgba(var(--acc-rgb),.9)}
.card.met .plocica .ic{color:var(--acc)}
.card.met .plocica i{background:var(--acc);border-color:transparent;color:#fff}
.card-h h3{font-size:16px;font-weight:640;margin:0;letter-spacing:-.012em}
.card-h .stanje{margin-left:auto;font-size:11px;color:var(--faint);letter-spacing:.04em;
  border:1px solid var(--line);border-radius:999px;padding:4px 10px;transition:all var(--t)}
.card.met .card-h .stanje{color:var(--acc);border-color:rgba(var(--acc-rgb),.4);background:var(--acc-dim)}

/* ---------- klizači ---------- */
.klz{padding:17px 0 6px;--fillc:linear-gradient(90deg,#4E5F70,#7E92A4)}
.klz.on{--fillc:linear-gradient(90deg,var(--acc2),var(--acc))}
.klz-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.klz-n{font-size:14.5px;color:var(--tx2)}
.klz.on .klz-n{color:var(--tx)}
.klz-v{font-family:var(--mono);font-size:15.5px;color:var(--muted);white-space:nowrap;transition:color var(--t)}
.klz.on .klz-v{color:var(--hot);font-weight:600;text-shadow:0 0 18px rgba(var(--hot-rgb),.55)}
.klz-tr{position:relative;margin:8px 0 0}
.klz-tr input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:none;margin:0;height:30px;display:block}
.klz-tr input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;
  background:linear-gradient(90deg,transparent 0 var(--f,0%),var(--trak) var(--f,0%) 100%),var(--fillc)}
.klz-tr input[type=range]::-moz-range-track{height:5px;border-radius:3px;
  background:linear-gradient(90deg,transparent 0 var(--f,0%),var(--trak) var(--f,0%) 100%),var(--fillc)}
.klz-tr input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7.5px;
  border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.5);transition:transform var(--t),box-shadow var(--t)}
.klz.on .klz-tr input[type=range]::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(var(--acc-rgb),.22),0 0 18px 2px rgba(var(--acc-rgb),.7)}
.klz-tr input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
.klz-tr input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:0;
  box-shadow:0 2px 8px rgba(0,0,0,.5)}
.klz-tick{position:absolute;top:9px;width:2px;height:12px;border-radius:1px;background:rgba(255,255,255,.45);pointer-events:none}
.klz.on .klz-tick{background:#fff;box-shadow:0 0 10px rgba(255,255,255,.6)}
.klz-tick:after{content:attr(data-p);position:absolute;top:14px;left:50%;transform:translateX(-50%);
  font-size:10px;color:var(--faint);white-space:nowrap;font-family:var(--mono)}
.klz-f{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--faint);margin-top:15px}
.klz.on .klz-f .st{color:var(--acc)}

/* ---------- kvačice, stepper ---------- */
.chk{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:14px 0 12px;transition:opacity var(--t)}
.klz+.klz,.chk+.chk,.klz+.chk{border-top:1px solid var(--line)}
.chk-box{flex:none;width:21px;height:21px;border:1.5px solid var(--line2);border-radius:7px;margin-top:1px;
  background:var(--sf2);transition:all var(--t)}
.chk:hover .chk-box{border-color:var(--muted)}
.chk.on .chk-box{background:linear-gradient(180deg,var(--acc),var(--acc-d));border-color:transparent;
  box-shadow:0 0 0 3px rgba(var(--acc-rgb),.16),0 0 16px rgba(var(--acc-rgb),.6);
  background-image:linear-gradient(180deg,var(--acc),var(--acc-d))}
.chk-t b{display:block;font-size:14.5px;font-weight:520;color:var(--tx2)}
.chk.on .chk-t b{color:#fff;font-weight:640}
.chk-t em{display:block;font-style:normal;font-size:13px;color:var(--faint);margin-top:3px;line-height:1.55}
.stp{padding:12px 0 2px}
.stp-c{display:flex;align-items:center;gap:14px;margin-top:12px}
.stp-c button{width:46px;height:46px;border:1px solid var(--line2);border-radius:13px;font-size:21px;color:var(--tx2);
  background:var(--sf2);transition:all var(--t)}
.stp-c button:hover{background:var(--sf4);color:#fff}
.stp-v{font-family:var(--mono);font-size:22px;min-width:26px;text-align:center}
.stp.on .stp-v{color:var(--hot);text-shadow:0 0 18px rgba(var(--hot-rgb),.55)}
.stp .st{font-size:11.5px;color:var(--faint);margin-left:auto}
.stp.on .st{color:var(--acc)}
.uslovno{font-size:13px;color:var(--faint);line-height:1.6;padding:14px 0 2px;border-top:1px solid var(--line);max-width:34em}

/* ---------- nalaz ---------- */
.nalaz{position:relative;overflow:hidden;margin:6px 0 18px;animation:ulaz .35s cubic-bezier(.2,.7,.3,1);padding:28px 24px 24px;border-radius:20px;
  border:1px solid rgba(47,216,168,.35);background:linear-gradient(180deg,var(--ok-dim),rgba(47,216,168,.03)),var(--panel);
  box-shadow:0 24px 60px -34px rgba(47,216,168,.6)}
.nalaz.yes{border-color:rgba(var(--acc-rgb),.45);
  background:radial-gradient(120% 120% at 50% -20%,rgba(var(--acc-rgb),.30),transparent 60%),
    var(--nalaz-bg);
  box-shadow:0 28px 70px -34px var(--acc)}
.nalaz .oznaka{margin:0;font-size:11.5px;color:var(--faint);letter-spacing:.16em;text-transform:uppercase}
.nalaz .ic-big{display:block;margin:16px 0 8px;color:var(--ok);filter:drop-shadow(0 0 14px rgba(47,216,168,.6))}
.nalaz.yes .ic-big{color:var(--acc);filter:drop-shadow(0 0 16px rgba(var(--acc-rgb),.75))}
.nalaz .rijec{display:block;font-family:var(--serif);font-size:44px;line-height:1.12;padding-bottom:.06em;font-weight:400;margin:0 0 10px;
  letter-spacing:-.03em;color:var(--ok);max-width:11em;text-wrap:balance;text-shadow:0 0 40px rgba(47,216,168,.35)}

const POZ=1000;
const zaokruzi=v=>{
  const k=v<20?1:v<100?1:v<1000?5:v<10000?50:v<100000?500:v<1000000?1000:10000;
  return Math.max(1,Math.round(v/k)*k);
};
function uPoziciju(v,o){
  if(!o.log)return v===null?0:Math.min(v,o.max);
  if(v===null||v<=0)return 0;
  const a=Math.log(o.vmin),b=Math.log(o.max);
  return Math.max(0,Math.min(POZ,Math.round((Math.log(Math.max(v,o.vmin))-a)/(b-a)*POZ)));
}
function izPozicije(pz,o){
  if(!o.log)return pz;
  if(pz<=0)return 0;
  const a=Math.log(o.vmin),b=Math.log(o.max);
  return zaokruzi(Math.exp(a+(pz/POZ)*(b-a)));
}

/* #eu ili #fbih u adresi bira okvir; ništa se ne pohranjuje */
/* cijela procjena se može spakovati u adresu; podaci putuju samo ako ti pošalješ link */
const B=v=>v===true?"1":v===false?"0":"-";
const izB=c=>c==="1"?true:c==="0"?false:null;
function uHash(){
  const g=S.gate,m=S.m,r=S.pr,v=S.v;
  return "#"+[
    (S.rezim==="dora"?"eu":"fbih"),
    (nacin==="prijetnja"?"p":"i"),
    B(g.prioritetna)+B(g.licencirana)+B(g.pristup),
    [v.klijentiPct,v.klijentiBroj,v.partneriPct,v.txBrojPct,v.txVrijPct,v.trajanjeH,v.prekidH,v.drzave,v.iznos].join(","),
    [m.relevantni,m.mediji,m.prituzbe,m.regulatorni,m.gubitakKlijenata,m.podaciA,m.podaciB].map(x=>x?"1":"0").join(""),
    B(r.a)+B(r.b)+(r.c1?"1":"0")+(r.c2?"1":"0")+(r.c3?"1":"0")+B(r.rel),
    String(korak)
  ].join("~");
}
function izHash(){
  try{
    const h=decodeURIComponent(location.hash||"");
    if(!h)return false;
    const d=h.slice(1).split("~");
    if(d.length<7)return false;
    S.rezim=d[0]==="eu"?"dora":"fba";
    nacin=d[1]==="p"?"prijetnja":"incident";
    S.gate.prioritetna=izB(d[2][0]); S.gate.licencirana=izB(d[2][1]); S.gate.pristup=izB(d[2][2]);
    const v=d[3].split(","),kl=["klijentiPct","klijentiBroj","partneriPct","txBrojPct","txVrijPct","trajanjeH","prekidH","drzave","iznos"];
    kl.forEach((k,i)=>{const x=(v[i]||"").trim(); S.v[k]=/^\d*\.?\d*$/.test(x)?x:"";});
    const mk=["relevantni","mediji","prituzbe","regulatorni","gubitakKlijenata","podaciA","podaciB"];
    mk.forEach((k,i)=>{S.m[k]=d[4][i]==="1";});
    S.pr.a=izB(d[5][0]); S.pr.b=izB(d[5][1]);
    S.pr.c1=d[5][2]==="1"; S.pr.c2=d[5][3]==="1"; S.pr.c3=d[5][4]==="1"; S.pr.rel=izB(d[5][5]);
    korak=Math.min(3,Math.max(1,Number(d[6])||1));
    return true;
  }catch(_){ return false; }
}
let hashTajmer=null;

  clearTimeout(hashTajmer);
  hashTajmer=setTimeout(()=>{try{
    history.replaceState(null,"",(location.pathname||"")+(location.search||"")+uHash());
  }catch(_){}} ,250);

const izHesa=()=>{try{
  const h=(location.hash||"").toLowerCase();
  return h==="#eu"||h==="#dora"?"dora":(h==="#fbih"||h==="#fba"?"fba":null);
}catch(_){return null;}};
if(!izHash())S.rezim=izHesa()||S.rezim;
const R=()=>REZIMI[S.rezim];
const T=()=>TXT[R().jezik];
const pop=(s,o)=>String(s).replace(/\{(\w+)\}/g,(_,k)=>o[k]!==undefined?o[k]:"{"+k+"}");
const fmtBr=n=>n===null?"—":n.toLocaleString(R().locale);
const fmtPct=p=>{if(p===null)return "—";const s=p.toFixed(1);return (R().jezik==="bs"?s.replace(".",","):s)+" %";};
const fmtNovac=n=>n===null?"—":(R().valutaPrefiks?R().valuta+" "+fmtBr(n):fmtBr(n)+" "+R().valuta);
function fmtSati(h){
  if(h===null)return "—";
  const d=Math.floor(h/24),r=h-d*24,hh=Math.floor(r),mm=Math.round((r-hh)*60);
  if(d>0)return d+" d "+hh+" h";
  return mm?hh+" h "+String(mm).padStart(2,"0")+" m":hh+" h";
}
const prekidVrijedi=()=>S.gate.prioritetna===true;
const pristupVrijedi=()=>S.gate.pristup===true;

/* ------------------------------ ocjena ---------------------------- */
function ocijeni(rezimP){
  const r=rezimP?REZIMI[rezimP]:R(),t=T(),V=k=>num(S.v[k]),preko=(k,p)=>V(k)!==null&&V(k)>p,m=S.m,d=(u,x)=>u?[x]:[];
  const razlozi=[];
  if(S.gate.prioritetna)razlozi.push(t.rz[0]);
  if(S.gate.licencirana)razlozi.push(t.rz[1]);
  if(S.gate.pristup)razlozi.push(t.rz[2]);
  const kapija=razlozi.length>0;
  const prekidMet=prekidVrijedi()&&preko("prekidH",PRAG.prekidSati);
  const podaciB=pristupVrijedi()&&m.podaciB;
  const K=[
    {id:1,naziv:t.k1,
     met:!!(preko("klijentiPct",PRAG.klijentiPct)||preko("klijentiBroj",r.klijentiBroj)||
       preko("partneriPct",PRAG.partneriPct)||preko("txBrojPct",PRAG.txBrojPct)||
       preko("txVrijPct",PRAG.txVrijPct)||m.relevantni),
     detalji:[].concat(
       d(preko("klijentiPct",PRAG.klijentiPct),pop(t.dKlijentiPct,{x:fmtPct(V("klijentiPct"))})),
       d(preko("klijentiBroj",r.klijentiBroj),pop(t.dKlijentiBroj,
         {x:(V("klijentiBroj")>=OPSEG.klijentiBroj.max?t.preko:"")+fmtBr(V("klijentiBroj"))})),
       d(preko("partneriPct",PRAG.partneriPct),pop(t.dPartneri,{x:fmtPct(V("partneriPct"))})),
       d(preko("txBrojPct",PRAG.txBrojPct),pop(t.dTxBroj,{x:fmtPct(V("txBrojPct"))})),
       d(preko("txVrijPct",PRAG.txVrijPct),pop(t.dTxVrij,{x:fmtPct(V("txVrijPct"))})),
       d(m.relevantni,t.dRelevantni))},
    {id:2,naziv:t.k2,
     met:!!(m.mediji||m.prituzbe||m.regulatorni||m.gubitakKlijenata),
     detalji:[].concat(d(m.mediji,t.dMediji),d(m.prituzbe,t.dPrituzbe),
       d(m.regulatorni,t.dRegulatorni),d(m.gubitakKlijenata,t.dOdlazak))},
    {id:3,naziv:t.k3,
     met:!!(preko("trajanjeH",PRAG.trajanjeSati)||prekidMet),
     detalji:[].concat(
       d(preko("trajanjeH",PRAG.trajanjeSati),pop(t.dTrajanje,{x:fmtSati(V("trajanjeH"))})),
       d(prekidMet,pop(t.dPrekid,{x:fmtSati(V("prekidH"))})))},
    {id:4,naziv:t.k4,
     met:!!(V("drzave")!==null&&V("drzave")>=PRAG.drzave),
     detalji:d(V("drzave")!==null&&V("drzave")>=PRAG.drzave,pop(t.dDrzave,{x:V("drzave")}))},
    {id:5,naziv:t.k5,met:!!(m.podaciA||podaciB),samostalan:!!podaciB,
     detalji:[].concat(d(m.podaciA,t.dPodaciA),d(podaciB,t.dPodaciB))},
    {id:6,naziv:pop(t.k6,{v:r.valuta}),met:!!preko("iznos",r.ekonomski),
     detalji:d(preko("iznos",r.ekonomski),pop(t.dIznos,
       {x:(V("iznos")>=OPSEG.iznos.max?t.preko:"")+fmtNovac(V("iznos"))}))}
  ];
  const broj=K.filter(k=>k.met).length,samostalan=!!podaciB;
  const znacajan=kapija&&(samostalan||broj>=2);
  const odgovorena=S.gate.prioritetna!==null&&S.gate.licencirana!==null&&S.gate.pristup!==null;
  let pravilo;
  if(!odgovorena)pravilo=t.prPrvo;
  else if(!kapija)pravilo=t.prNema;
  else if(samostalan)pravilo=t.prSam;
  else if(broj>=2)pravilo=pop(t.prDva,{n:broj});
  else pravilo=pop(t.prMalo,{n:broj});
  return {kapija,razlozi,K,broj,samostalan,znacajan,pravilo,odgovorena};
}


/* koliko fali do promjene ishoda */
function najblizi(){
  const r=R(),t=T(),o=ocijeni();
  if(!o.odgovorena||!o.kapija||o.znacajan)return null;
  const V=k=>num(S.v[k]),kand=[];
  const dodaj=(kljuc,prag,ime,fmt,kri)=>{
    if(o.K[kri].met)return;
    const v=V(kljuc); if(v===null||v<=0)return;
    kand.push({ime:ime,gap:prag-v,rel:(prag-v)/prag,fmt:fmt});
  };
  dodaj("klijentiPct",PRAG.klijentiPct,t.k1a,fmtPct,0);
  dodaj("klijentiBroj",r.klijentiBroj,t.k1b,fmtBr,0);
  dodaj("partneriPct",PRAG.partneriPct,t.k1c,fmtPct,0);
  dodaj("txBrojPct",PRAG.txBrojPct,t.k1d,fmtPct,0);
  dodaj("txVrijPct",PRAG.txVrijPct,t.k1e,fmtPct,0);
  dodaj("trajanjeH",PRAG.trajanjeSati,t.k3a,fmtSati,2);
  if(prekidVrijedi())dodaj("prekidH",PRAG.prekidSati,t.k3b,fmtSati,2);
  dodaj("iznos",r.ekonomski,t.k6a,fmtNovac,5);
  const dr=V("drzave");
  if(!o.K[3].met&&dr!==null&&dr>0)kand.push({ime:t.k4a,gap:PRAG.drzave-dr,rel:(PRAG.drzave-dr)/PRAG.drzave,fmt:x=>String(x)});
  if(!kand.length)return null;
  kand.sort((a,b)=>a.rel-b.rel);
  const n=kand[0];
  if(n.gap<=0)return pop(t.naPragu,{k:n.ime});
  return pop(o.broj>=1?t.faliJedan:t.faliDva,{k:n.ime,g:n.fmt(n.gap)});
}

/* --------------------------- cyber prijetnja ---------------------------
   Ozbiljna je samo ako su ispunjena sva tri uslova zajedno.            */
function ocijeniPrijetnju(rezimP){
  const t=T(),r=S.pr,dobrovoljno=(rezimP||S.rezim)==="dora";
  const c=!!(r.c1||r.c2||r.c3);
  const ozbiljna=r.a===true&&r.b===true&&c;
  const odgovoreno=r.a!==null&&r.b!==null;
  let broj=0; if(r.a===true)broj++; if(r.b===true)broj++; if(c)broj++;
  /* ozbiljnost je klasifikacija; obaveza prema organu je zasebno pitanje:
     u FBiH dužnost uz procjenu relevantnosti, u EU dobrovoljna obavijest */
  const obaveza = ozbiljna && !dobrovoljno && r.rel===true;
  const preporuka = ozbiljna && dobrovoljno && r.rel===true;
  let ishod, opis;
  if(!ozbiljna){ ishod="nije"; opis=t.pNema; }
  else if(dobrovoljno){ ishod=preporuka?"dobrovoljno":"prati"; opis=preporuka?t.pDobrovoljno:t.pOzbiljnaNerel; }
  else { ishod=obaveza?"obaveza":"prati"; opis=obaveza?t.pObaveza:t.pOzbiljnaNerel; }
  return {ozbiljna:ozbiljna,broj:broj,c:c,odgovoreno:odgovoreno,obaveza:obaveza,
    dobrovoljno:dobrovoljno,ishod:ishod,opis:opis,
    naslov: ishod==="obaveza"?t.pNaslovObaveza : ishod==="dobrovoljno"?t.pNaslovDobro :
            ishod==="prati"?t.pNaslovPrati : t.pNije,
    pravilo:ozbiljna?t.pPravilo2:t.pPravilo1};
}

function yn(put,val){
  const t=T();
  return '<span class="yn" data-yn="'+put+'">'+
    '<button type="button" class="da'+(val===true?" on":"")+'" aria-pressed="'+(val===true)+'" data-val="1">'+(R().jezik==="bs"?"Da":"Yes")+'</button>'+
    '<button type="button" class="ne'+(val===false?" on":"")+'" aria-pressed="'+(val===false)+'" data-val="0">'+(R().jezik==="bs"?"Ne":"No")+'</button></span>';
}
function chk(put,val,naziv,opis){
  return '<button type="button" class="chk'+(val?" on":"")+'" role="checkbox" aria-checked="'+(!!val)+'" data-chk="'+put+'">'+
    '<span class="chk-box"></span><span class="chk-t"><b>'+esc(naziv)+'</b>'+(opis?'<em>'+esc(opis)+'</em>':"")+'</span></button>';
}
function klizac(o){
  const t=T(),n=num(S.v[o.put]),dos=n!==null&&n>o.pragVal;
  const maks=o.log?POZ:o.max, korak=o.log?1:o.step;
  const pz=uPoziciju(n,o), pragPz=uPoziciju(o.pragVal,o);
  const poz=Math.min(100,pragPz/maks*100), fil=(pz/maks*100).toFixed(1);
  return '<div class="klz'+(dos?" on":"")+'" data-klz="'+o.put+'">'+
    '<div class="klz-h"><span class="klz-n">'+esc(o.naslov)+'</span><span class="klz-v">'+
      (n===null?"—":o.prikaz(n)+(n>=o.max?"+":""))+'</span></div>'+
    '<div class="klz-tr"><input type="range" min="0" max="'+maks+'" step="'+korak+'" value="'+pz+'" style="--f:'+fil+'%" aria-label="'+esc(o.naslov)+'">'+
    '<span class="klz-tick" style="left:'+poz+'%" data-p="'+esc(o.prikaz(o.pragVal))+'"></span></div>'+
    '<div class="klz-f"><span>'+esc(o.pragTekst)+'</span><span class="st">'+(dos?t.prekoracen:t.ispod)+'</span></div></div>';
}
function kartica(br,ik,naslov,met,unutra){
  const t=T();
  return '<div class="card'+(met?" met":"")+'"><div class="card-h">'+
    '<span class="plocica">'+ikona(ik)+'<i>'+br+'</i></span>'+
    '<h3>'+esc(naslov)+'</h3><span class="stanje">'+(met?t.dosegnut:t.nijeDosegnut)+'</span></div>'+unutra+'</div>';

function staze(){
  const im=nacin==="prijetnja"?T().koraciP:T().koraci;

    '<h3>Rokovi</h3>'+
    '<p>Inicijalno obavještenje dostavlja se u roku od četiri sata od klasifikacije incidenta kao značajnog, a najkasnije 24 sata od otkrivanja; ako je klasifikacija kasnija od 24 sata, rok je četiri sata od nje. Privremeni statusni izvještaj ide 72 sata poslije inicijalnog i ažurira se bez odgode kad se uspostave redovne aktivnosti. Konačni izvještaj ide mjesec dana od privremenog. Uputstvo nema odredbu o vikendu ni prazniku, pa rokovi teku neprekidno. Kašnjenje se mora obrazložiti Agenciji unutar roka.</p>'+
    '<p class="izvor">čl. 7 Uputstva o sadržaju i rokovima izvještaja (01-5267/25)</p>'+

    '<h3>Kad se ne prijavljuje</h3>'+
    '<p>Incident se i tada evidentira, jer banka vodi evidenciju svih IKT incidenata. Incidenti s istim očitim osnovnim uzrokom koji se ponove najmanje dva puta u šest mjeseci i kumulativno ispune kriterije tretiraju se kao jedan značajan incident, a ta se procjena radi svakog mjeseca. Odvojeno treba razmotriti obavještavanje drugih organa u BiH, na primjer kod povrede ličnih podataka.</p>'+
    '<p class="izvor">čl. 10 st. 2 i 3 Uputstva · Odluka čl. 41 st. 3 i čl. 44 st. 6</p>'+

    '<h3>Cyber prijetnje</h3>'+
    '<p>Prijetnja se smatra ozbiljnom samo ako su ispunjena sva tri uslova zajedno: da bi, ako se ostvari, mogla utjecati na prioritetne funkcije ili na druge subjekte, treće strane, klijente i partnere; da je realno da se ostvari, uz procjenu ranjivosti, sposobnosti i namjera aktera i postojanosti prijetnje; i da bi, ako se ostvari, dosegnula kritičnost usluga, prag klijenata i transakcija ili geografski prag. Ostali pragovi se mogu uzeti u obzir ako banka procijeni da bi bili dosegnuti.</p>'+
    '<p>Ozbiljnost i obaveza nisu isto. Banka je dužna odmah po saznanju obavijestiti Agenciju samo ako procijeni da je prijetnja relevantna za finansijski sektor, korisnike usluga ili klijente. Uz to, ako je primjenjivo, potencijalno ugrožene klijente treba pravovremeno obavijestiti i dati im informacije o zaštitnim mjerama.</p>'+
    '<p class="izvor">čl. 12 Uputstva · Odluka čl. 42 st. 2 i čl. 44 st. 3 i 4</p>'+
    '<h3>Gdje završavaju podaci</h3>'+
    '<p>Nigdje. Alat je jedna HTML datoteka koja se izvršava u tvom pregledniku. Nema servera, baze, kolačića ni analitike; ništa se ne pohranjuje ni lokalno. Osvježavanje stranice briše sve unesene vrijednosti.</p>'+
    '<p>Nijedna vrijednost ne napušta uređaj, a to nije stvar povjerenja nego postavke: datoteka nosi zaglavlje sigurnosne politike koje pregledniku zabranjuje bilo kakvu mrežnu konekciju. Provjeri sam — otvori razvojne alate preglednika, karticu Network, i prođi kroz cijelu procjenu. Neće se pojaviti nijedan zahtjev.</p>'+
    '<p>Isti alat možeš preuzeti i pokrenuti bez mreže, na računaru bez internet veze. Radi identično jer mreža nikad nije ni bila potrebna.</p>'+
    '<h3>Ograničenja</h3>'+
    '<p>Ovo je pomoćna trijaža jednog incidenta, ne odluka i ne izvještaj. Ne pokriva ozbiljne cyber prijetnje iz čl. 12 Uputstva, koje imaju vlastite kriterije, ni sadržaj samih izvještaja. Kvalitativni kriteriji poput ugleda i gubitka podataka počivaju na prosudbi koju alat ne može provjeriti. Klasifikaciju potvrđuje odgovorna osoba u banci, a mjerodavan je izvorni tekst propisa.</p>'+
    '<p class="izvor">Uputstva se primjenjuju od 01.04.2026.</p>';

  }else{
    h+='<h2>How is this calculated?</h2>'+
    '<p>This describes the DORA framework: Commission Delegated Regulation (EU) 2024/1772 on the classification of ICT-related incidents, and Commission Delegated Regulation (EU) 2025/301 on the content and time limits of the reports. The assessment has two conditions and both must be satisfied.</p>'+

    '<h3>First condition — critical services</h3>'+
    '<p>It is satisfied where the incident affects ICT services or network and information systems that support critical or important functions, or financial services subject to authorisation, or where a successful malicious and unauthorised access to network and information systems has been identified.</p>'+
    '<p class="izvor">Art. 6 RTS (EU) 2024/1772</p>'+

    '<h3>Second condition — thresholds</h3>'+
    '<p>Where the first condition is met, the incident is major if the threshold in Art. 9(5)(b), malicious access that may result in data losses, is met on its own, or if at least two of the other thresholds in Art. 9(1) to (6) are met. Several sub-thresholds exceeded within the same criterion still count as one criterion.</p>'+
    '<p class="izvor">Art. 8(1) RTS (EU) 2024/1772</p>'+

    '<h3>Why some questions do not appear</h3>'+
    '<p>The two-hour service downtime threshold applies to ICT services supporting critical or important functions, so it is hidden where the answer to the first question is no. The second data-losses threshold presumes a successful malicious and unauthorised access, so it is hidden where the answer to the third question is no.</p>'+

    '<h3>The six criteria</h3>'+
    '<table class="tbl"><tr><th>Criterion</th><th>Threshold</th><th>Basis</th></tr>'+
    red("Share of clients affected","more than 10 % of clients using the affected service","Art. 9(1)(a)")+
    red("Number of clients affected","more than 100,000 clients","Art. 9(1)(b)")+
    red("Share of financial counterparts","more than 30 % of those involved in the service","Art. 9(1)(c)")+
    red("Number of transactions","more than 10 % of the average daily number","Art. 9(1)(d)")+
    red("Value of transactions","more than 10 % of the average daily value","Art. 9(1)(e)")+
    red("Relevant clients or counterparts","an entity identified as relevant is affected","Art. 9(1)(f), Art. 1(3)")+
    red("Reputational impact","media coverage, repetitive complaints, regulatory requirements that cannot be met, or loss of material clients","Art. 9(2), Art. 2")+
    red("Incident duration","more than 24 hours","Art. 9(3)(a)")+
    red("Service downtime","more than 2 hours on a critical or important function","Art. 9(3)(b)")+
    red("Geographical spread","two or more Member States","Art. 9(4), Art. 4")+
    red("Data losses","availability, authenticity, integrity or confidentiality compromised with an adverse impact; or malicious access that may result in data losses","Art. 9(5)")+
    red("Economic impact","more than EUR 100,000, incurred or likely","Art. 9(6)")+
    '</table>'+

    '<h3>What goes into the figures</h3><ul>'+
    '<li>Clients are all those affected, natural or legal persons, who could not use the service or were adversely affected, including third parties covered by the contract between the entity and the client.</li>'+
    '<li>The denominator for shares is the client base of the affected service. A service defined too narrowly easily produces a 100 % share, so the level of aggregation should be set out in internal methodology.</li>'+
    '<li>Duration is measured from occurrence to resolution; where the moment of occurrence is unknown, from detection. Downtime is measured from the service becoming unavailable until regular activities are restored, including the time until a delayed service is fully delivered.</li>'+
    '<li>Economic impact covers direct and indirect costs and losses, without deducting financial recoveries. Costs of general maintenance, post-incident improvements and insurance premiums are excluded.</li>'+
    '<li>Where actual numbers or amounts cannot be determined, they are estimated on the basis of data from comparable reference periods.</li></ul>'+
    '<p class="izvor">Art. 1, 3 and 7 RTS (EU) 2024/1772</p>'+

    '<h3>Deadlines</h3>'+
    '<p>The initial notification is due within four hours of classifying the incident as major and no later than 24 hours from becoming aware of it; where classification takes longer than 24 hours, the deadline is four hours from classification. The intermediate report follows 72 hours after the initial notification and is updated without delay once regular activities are restored. The final report is due one month after the intermediate report.</p>'+
    '<p>A deadline falling on a weekend or a public holiday moves to noon of the next working day. That extension does not apply to the initial notification or the intermediate report of credit institutions, central counterparties, trading venues, and entities identified as essential or important under NIS2, so for a bank it is available only for the final report.</p>'+
    '<p class="izvor">Art. 5 RTS (EU) 2025/301</p>'+

    '<h3>When it is not reportable</h3>'+
    '<p>The incident is still recorded. Recurring incidents with the same apparent root cause occurring at least twice within six months and cumulatively meeting the criteria are treated as one major incident, a check performed monthly; that rule does not apply to microenterprises or to the entities listed in Art. 16(1) of DORA. Reporting obligations towards other authorities, for example on personal data breaches, must be considered separately.</p>'+
    '<p class="izvor">Art. 8(2) RTS (EU) 2024/1772 · Art. 17 DORA</p>'+

    '<h3>Where the report goes</h3>'+
    '<p>Major incidents are reported to the competent authority. For significant credit institutions supervised directly under the SSM this is the ECB; for others it is the national competent authority. The technical standards themselves are drafted by the ESAs, which do not receive the reports.</p>'+

    '<h3>Cyber threats</h3>'+
    '<p>A threat counts as significant only where all three conditions hold together: that, if materialised, it could affect critical or important functions or other entities, providers, clients and counterparts; that it has a high probability of materialising, judged on vulnerabilities, the capability and intent of threat actors, and the persistence of the threat; and that, if materialised, it would meet the criticality of services, the client and transaction threshold, or the geographical threshold. The remaining thresholds may be considered where the entity concludes they could be met.</p>'+
    '<p>Significance and duty are separate. Notification to the competent authority is voluntary under DORA: the entity may notify where it deems the threat relevant to the financial system, service users or clients. Where applicable, potentially affected clients are to be informed of appropriate protection measures.</p>'+
    '<p class="izvor">Art. 10 RTS 2024/1772 · DORA Art. 18(2) and 19(2)–(3)</p>'+
    '<h3>Where the data ends up</h3>'+
    '<p>Nowhere. The tool is a single HTML file that runs in your browser. There is no server, no database, no cookies and no analytics; nothing is stored locally either. Refreshing the page clears every value you entered.</p>'+
    '<p>No value leaves the device, and that is not a matter of trust but of configuration: the file carries a content security policy header that forbids the browser from opening any network connection. Check it yourself — open the developer tools, the Network tab, and run through the whole assessment. Not a single request will appear.</p>'+
    '<p>You can download the same file and run it on a machine with no internet connection at all. It behaves identically, because the network was never needed.</p>'+
    '<h3>Limitations</h3>'+
    '<p>This is a triage aid for a single incident, not a decision and not a report. It does not cover significant cyber threats, whose notification is voluntary and governed by its own criteria, nor the content of the reports themselves. Qualitative criteria such as reputational impact and data losses rest on judgement the tool cannot verify. The original legal texts prevail.</p>';
  }
  h+='</div>';
  document.getElementById("o-alatu").innerHTML=h;
  document.getElementById("o-alatu").style.display="block";
  window.scrollTo(0,0);
}

/* --------------------------- nalaz kao tekst ---------------------- */
function nalazTekst(){
  const r=R(),t=T();
  if(nacin==="prijetnja"){
    const q=ocijeniPrijetnju(),pr=S.pr,L=[];
    L.push(t.nacinP.toUpperCase()+" — "+t.okvir+" "+r.oznaka); L.push("");
    L.push(t.txtNalaz+q.naslov.toUpperCase());
    L.push(t.txtObraz+q.pravilo+(q.ozbiljna?" · "+t.pOzbiljna:""));
    L.push("");
    L.push("A "+t.pA+": "+(pr.a===true?"da":"ne"));
    L.push("B "+t.pB+": "+(pr.b===true?"da":"ne"));
    L.push("C "+t.pC+": "+([pr.c1?t.pC1:"",pr.c2?t.pC2:"",pr.c3?t.pC3:""].filter(Boolean).join("; ")||"—"));
    L.push("D "+t.pRel+": "+(pr.rel===true?"da":pr.rel===false?"ne":"—"));
    L.push("");
    L.push(q.opis);
    if(q.ozbiljna)L.push(t.pKlijenti);
    L.push(t.txtAnon);
    return L.join("\n");
  }
  const o=ocijeni();
  const L=[pop(t.txtNaslov,{r:r.oznaka,v:r.valuta}),""];
  L.push(t.txtNalaz+(o.znacajan?t.txtDa:t.txtNe));
  L.push(t.txtObraz+o.pravilo);
  L.push("");
  L.push(t.txtUsluge+(o.razlozi.join("; ")||t.txtNijedna));
  const isp=o.K.filter(k=>k.met);
  if(isp.length){L.push(pop(t.txtKrit,{n:o.broj}));isp.forEach(k=>L.push("  - "+k.naziv+": "+k.detalji.join("; ")));}
  else L.push(t.txtNemaKrit);
  L.push("");
  L.push(o.znacajan?t.txtRokovi:t.txtEvid);
  if(num(S.v.klijentiBroj)>=OPSEG.klijentiBroj.max||num(S.v.iznos)>=OPSEG.iznos.max)L.push(t.txtMaks);
  L.push(t.txtAnon);
  return L.join("\n");
}

/* kratkotrajna napomena iznad trake */
let tostTajmer=null, potvrdaPodaci=false;
function tost(tekst){
  const el=document.getElementById("tost");
  el.textContent=tekst;
  el.classList.add("vidljiv");
  clearTimeout(tostTajmer);
  tostTajmer=setTimeout(()=>el.classList.remove("vidljiv"),8000);
}

function kopirajTekst(tekst){
  const ta=document.createElement("textarea");
  ta.value=tekst; ta.setAttribute("readonly","readonly");
  ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  let uspjeh=false;
  try{uspjeh=document.execCommand("copy");}catch(_){}
  document.body.removeChild(ta);
  return uspjeh;
}

/* nalaz kao slika — crta se u pregledniku, ništa se ne šalje */
function sacuvajSliku(){
  const t=T(),r=R(),o=nacin==="prijetnja"?null:ocijeni(),q=nacin==="prijetnja"?ocijeniPrijetnju():null;
  const W=1200,H=630,c=document.createElement("canvas");
  c.width=W;c.height=H;
  const x=c.getContext("2d");
  const znacajno=o?o.znacajan:q.ozbiljna;
  x.fillStyle="#0A0E13";x.fillRect(0,0,W,H);
  const g=x.createLinearGradient(0,0,W,H);
  g.addColorStop(0,znacajno?"rgba(255,59,92,.28)":"rgba(47,216,168,.16)");
  g.addColorStop(1,"rgba(10,14,19,0)");
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle="#63768A";x.font="500 22px system-ui,sans-serif";
  x.fillText((nacin==="prijetnja"?t.nacinP:t.eyebrow)+"  ·  "+r.oznaka,64,86);
  x.fillStyle=znacajno?"#FF3B5C":"#2FD8A8";
  x.font="400 74px Georgia,serif";
  const naslovS=o?(o.znacajan?t.prijaviti:t.nePrijavljuje):(q.ozbiljna?t.pOzbiljna:t.pNije);
  x.fillText(naslovS.length>34?naslovS.slice(0,33)+"…":naslovS,64,180);
  x.fillStyle="#BAC7D4";x.font="400 26px system-ui,sans-serif";
  x.fillText(o?(o.znacajan?t.znacajan:t.nijeZnacajan):(q.ozbiljna?t.pPravilo2:t.pPravilo1),64,226);
  x.strokeStyle="rgba(255,255,255,.14)";x.beginPath();x.moveTo(64,262);x.lineTo(W-64,262);x.stroke();
  x.font="400 24px system-ui,sans-serif";
  let y=310;
  const redovi=[];
  if(o){
    redovi.push((o.samostalan?"5b":o.broj+"/6")+"  ·  "+o.pravilo);
    o.razlozi.forEach(v=>redovi.push("— "+v));
    o.K.filter(k=>k.met).forEach(k=>redovi.push("— "+k.naziv+": "+k.detalji.join("; ")));
  }else{
    redovi.push(q.broj+"/3  ·  "+q.pravilo);
    redovi.push("— "+(q.ozbiljna?t.pObaveza:t.pNema));
  }
  redovi.slice(0,7).forEach(v=>{
    x.fillStyle="#BAC7D4";
    x.fillText(v.length>92?v.slice(0,91)+"…":v,64,y); y+=40;
  });
  x.fillStyle="#63768A";x.font="400 20px system-ui,sans-serif";
  x.fillText(t.txtAnon,64,H-52);
  try{
    const a=document.createElement("a");
    a.href=c.toDataURL("image/png");
    a.download="trijaza-ikt.png";
    a.click();
  }catch(_){}
}

/* ---------------------------- interakcija ------------------------- */
function postavi(put,val){const d=put.split(".");if(d.length===1)S[d[0]]=val;else S[d[0]][d[1]]=val;}
function uzmi(put){const d=put.split(".");return d.length===1?S[d[0]]:S[d[0]][d[1]];}

document.addEventListener("keydown",e=>{
  const uPolju=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||""));
  /* 1–3 mijenjaju odgovore na tekućem ekranu, Enter vodi dalje */
  if(!uPolju&&"123".includes(e.key)){
    const i=Number(e.key)-1;
    if(nacin==="prijetnja"){
      if(korak===1&&i<2){const k=i===0?"a":"b";S.pr[k]=S.pr[k]===true?false:true;e.preventDefault();return crtaj();}
      if(korak===2&&i===2){S.pr.rel=S.pr.rel===true?false:true;e.preventDefault();return crtaj();}
    }else if(korak===1){
      const k=["prioritetna","licencirana","pristup"][i];
      S.gate[k]=S.gate[k]===true?false:true;
      potvrdaPodaci=false;
      if(!prekidVrijedi())S.v.prekidH="";
      if(!pristupVrijedi())S.m.podaciB=false;
      e.preventDefault(); return crtaj();
    }
  }
  if(!uPolju&&e.key==="Enter"){
    const d=document.querySelector(".nav .dalje:not([disabled])");
    if(d){e.preventDefault();d.click();return;}
  }
  if(e.key==="Escape"){
    const o=document.getElementById("o-alatu");
    if(o.style.display!=="none"){o.style.display="none";e.preventDefault();}
  }
});

/* pomjeranje klizača mijenja samo svoj red, karticu i traku — bez ponovnog crtanja stranice */
function osvjeziKlizac(w){
  const t=T(),kljuc=w.dataset.klz,el=w.querySelector("input[type=range]"),op=OPSEG[kljuc];
  const n=num(S.v[kljuc]),maks=op.max,prag=pragZa(kljuc),dos=n!==null&&n>prag;
  el.style.setProperty("--f",(uPoziciju(n,op)/(op.log?POZ:op.max)*100).toFixed(1)+"%");
  w.classList.toggle("on",dos);
  w.querySelector(".klz-v").textContent=(n===null?"—":PRIKAZI[kljuc](n)+(n>=maks?"+":""));
  w.querySelector(".klz-f .st").textContent=dos?t.prekoracen:t.ispod;
  const o=ocijeni();
  document.querySelectorAll(".card").forEach((c,i)=>{
    if(!o.K[i])return;
    c.classList.toggle("met",o.K[i].met);
    const st=c.querySelector(".card-h .stanje");
    if(st)st.textContent=o.K[i].met?t.dosegnut:t.nijeDosegnut;
  });
  crtajTraku(o);
}

document.addEventListener("input",e=>{
  if(e.target.type==="range"){
    const w=e.target.closest("[data-klz]"),kljuc=w.dataset.klz,op=OPSEG[kljuc];
    S.v[kljuc]=String(op.log?izPozicije(Number(e.target.value),op):e.target.value);

});

document.addEventListener("click",e=>{
  if(e.target.id==="tost"){e.target.classList.remove("vidljiv");return;}
  const t=e.target.closest("button");
  if(!t)return;
  if(t.dataset.zatvori!==undefined){document.getElementById("o-alatu").style.display="none";return;}
  if(t.dataset.o!==undefined)return crtajOAlatu();
  if(t.dataset.nacin){nacin=t.dataset.nacin;korak=1;uporediOtvoren=false;potvrdaPodaci=false;window.scrollTo(0,0);return crtaj();}
  if(t.dataset.uporedi!==undefined){uporediOtvoren=!uporediOtvoren;return crtaj();}
  if(t.dataset.link!==undefined){
    const adresa=(location.origin||"")+(location.pathname||"")+uHash();
    const lab=t.querySelector("span")||t, star=T().link;
    kopirajTekst(adresa)?lab.textContent=T().linkOk:lab.textContent=T().kopGreska;
    setTimeout(()=>{lab.textContent=star;},1800);
    return;
  }
  if(t.dataset.slika!==undefined){sacuvajSliku();return;}
  if(t.dataset.rez){
    S.rezim=t.dataset.rez;
    return crtaj();
  }
  const y=t.closest("[data-yn]");
  if(y){
    potvrdaPodaci=false;
    postavi(y.dataset.yn,t.dataset.val==="1");
    if(!prekidVrijedi())S.v.prekidH="";
    if(!pristupVrijedi())S.m.podaciB=false;
    return crtaj();
  }
  if(t.dataset.chk){potvrdaPodaci=false;postavi(t.dataset.chk,!uzmi(t.dataset.chk));return crtaj();}
  if(t.dataset.drz!==undefined){
    const dr=num(S.v.drzave)||0;
    S.v.drzave=String(Math.max(0,Math.min(30,dr+Number(t.dataset.drz))));
    return crtaj();
  }
  if(t.dataset.primjer!==undefined){
    const x=PRIMJERI[Number(t.dataset.primjer)],rez=S.rezim;
    S=prazno(); S.rezim=rez;
    S.gate=Object.assign({},x.st.gate); S.v=Object.assign({},x.st.v); S.m=Object.assign({},x.st.m);
    korak=2; potvrdaPodaci=false; window.scrollTo(0,0); return crtaj();
  }
  if(t.dataset.ispis!==undefined){window.print();return;}
  if(t.dataset.dalje!==undefined){
    /* prije nalaza: ako je utvrđen pristup a nijedan prag pod Podaci nije označen,
       prvi klik samo upozorava i ostavlja prostor za dopunu */
    if(korak===2&&S.gate.pristup===true&&!S.m.podaciA&&!S.m.podaciB&&!potvrdaPodaci){
      potvrdaPodaci=true; tost(T().tostPodaci); return;
    }
    korak=Math.min(3,korak+1); window.scrollTo(0,0); crtaj();
    return;
  }
  if(t.dataset.nazad!==undefined){potvrdaPodaci=false;korak=Math.max(1,korak-1);window.scrollTo(0,0);return crtaj();}
  if(t.dataset.reset!==undefined){const r=S.rezim;S=prazno();S.rezim=r;korak=1;potvrdaPodaci=false;uporediOtvoren=false;window.scrollTo(0,0);return crtaj();}
  if(t.dataset.kopiraj!==undefined){
    const lab=t.querySelector("span")||t, vrati=T().kopiraj;
    lab.textContent=kopirajTekst(nalazTekst())?T().kopirano:T().kopGreska;
    setTimeout(()=>{lab.textContent=vrati;},1600);
    return;
  }
});

window.addEventListener("hashchange",()=>{if(izHash())crtaj();});
crtaj();
</script>
